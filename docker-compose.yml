services:
  mysql:
    image: mysql:8.4
    container_name: ticketrush-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketrush
      MYSQL_USER: ticketrush
      MYSQL_PASSWORD: ticketrush
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: ticketrush-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data: